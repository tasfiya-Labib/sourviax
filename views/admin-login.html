<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sourviax | Admin login</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { align-items: center; background: #07162e; color: #f4f7fb; display: flex; font-family: Arial, sans-serif; justify-content: center; margin: 0; min-height: 100vh; padding: 24px; }
    main { background: #0b2a5b; border: 1px solid #d6a84f; border-radius: 12px; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); max-width: 400px; padding: 32px; width: 100%; }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { color: #b9cbe1; margin: 0 0 24px; }
    label { display: block; font-size: 13px; font-weight: 700; margin: 16px 0 7px; }
    input { background: #041326; border: 1px solid #6681a8; border-radius: 6px; color: #fff; padding: 12px; width: 100%; }
    button { background: #f4b942; border: 0; border-radius: 6px; color: #07162e; cursor: pointer; font-weight: 700; margin-top: 22px; padding: 13px; width: 100%; }
    a { color: #f4b942; display: inline-block; margin-top: 20px; }
  </style>
</head>
<body>
  <main>
    <h1>Supplier workspace</h1>
    <p>Sign in to continue.</p>
    <form action="/admin/login" method="post">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in</button>
    </form>
    <a href="/">Back to marketplace</a>
  </main>
</body>
</html>
